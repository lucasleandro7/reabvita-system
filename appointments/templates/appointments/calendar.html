{% load static %}

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agenda Visual</title>

    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        min-height: 100vh;
        padding: 30px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #0f172a;
      }

      .top-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
      }

      .nav-btn {
        padding: 10px 18px;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .dashboard-btn {
        background: #2563eb;
      }

      .dashboard-btn:hover {
        background: #1d4ed8;
      }

      .schedule-btn {
        background: #16a34a;
      }

      .schedule-btn:hover {
        background: #15803d;
      }

      #calendar {
        background: white;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Agenda Visual</h1>

      <div class="top-actions">
        <a href="/dashboard/" class="nav-btn dashboard-btn"> Dashboard </a>

        <a href="/schedule/" class="nav-btn schedule-btn"> Agenda Lista </a>
      </div>

      <div id="calendar"></div>
    </div>

    {{ events|json_script:"calendar-events" }}

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const calendarEl = document.getElementById("calendar");

        const events = JSON.parse(
          document.getElementById("calendar-events").textContent,
        );

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",

          locale: "pt-br",

          height: "auto",

          events: events,
        });

        calendar.render();
      });
    </script>
  </body>
</html>
