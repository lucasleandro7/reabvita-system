{% load static %}

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reabvita</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          url("{% static 'appointments/images/fundo.jpg' %}");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
      }

      .logo {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
      }

      .logo img {
        width: 300%;
        max-width: 200px;
        border-radius: 12px;
      }

      .top-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 25px;
      }

      .top-buttons a {
        text-decoration: none;
        color: white;
        text-align: center;
        padding: 14px;
        border-radius: 12px;
        font-weight: bold;
        transition: 0.3s;
      }

      .professional-btn {
        background: #0f172a;
      }

      .professional-btn:hover {
        background: #020617;
      }

      .cancel-btn {
        background: #b89146;
      }

      .cancel-btn:hover {
        background: #9a7637;
      }

      .appointments-btn {
        background: #0f172a;
      }

      .appointments-btn:hover {
        background: #1e293b;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        font-weight: bold;
        color: #334155;
      }

      input,
      select {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 16px;
      }

      button {
        border: none;
        padding: 15px;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;

        display: block;
        margin: 15px auto 0 auto;
      }

      button:hover {
        background: #1d4ed8;
      }

      .success {
        background: #dcfce7;
        color: #166534;
        padding: 14px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 14px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
      }

     .professional-description {
    display: none;
    font-size: 14px;
    color: #475569;
    margin-top: 10px;
    margin-bottom: 20px;
    line-height: 1.6;
    background: #f8fafc;
    padding: 14px;
    border-radius: 8px;
    border-left: 4px solid #b89146;
}
      
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">
        <img
          src="{% static 'appointments/images/logo.jpg' %}"
          alt="Logo Reabvita"
        />
      </div>

      <div class="top-buttons">
        <a href="/login/" class="professional-btn"> Área Profissional </a>

        <a href="/cancel/" class="cancel-btn"> Cancelar Consulta </a>

        <a href="/meus-agendamentos/" class="appointments-btn">
          Meus Agendamentos
        </a>
      </div>

      {% if success %}

      <div class="success">Consulta agendada com sucesso!</div>

      {% endif %} {% if error %}

      <div class="error">{{ error }}</div>

      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div>
          <label>Nome</label>

          <input
            type="text"
            name="name"
            placeholder="Digite seu nome"
            required
          />
        </div>

        <div>
          <label>Telefone</label>

          <input
            type="text"
            name="phone"
            placeholder="Digite seu telefone"
            required
          />
        </div>

        <!--
        <div>
          <label>Email</label>

          <input
            type="email"
            name="email"
            placeholder="Digite seu email"
            required 
          />
        </div>-->

        <div>
 <div>
  <label>Escolha o Atendimento</label>

  <select id="professional" name="professional" required>
    <option value="">Selecione</option>
    <option value="aline">Aline Leandro</option>
    <option value="gustavo">Gustavo Leandro</option>
    <option value="isabel">Isabel Novais</option>
  </select>

  <div id="professional-description" class="professional-description"></div>

</div>

<div>
  <label>Tipo de Consulta</label>

  <select name="service_type" required>
    <option value="">Selecione</option>

    <option value="avaliacao">Avaliação</option>

    <option value="atendimento">Atendimento</option>
  </select>
</div>


        <div>
          <label>Data da Consulta</label>

          <input
            type="date"
            id="appointment_date"
            name="appointment_date"
            min="{{ today }}"
            required
          />
        </div>

        <div>
          <label>Horário</label>

          <select id="appointment_time" name="appointment_time" required>
            <option value="">Selecione um horário</option>
          </select>
        </div>

        <button type="submit">Agendar Consulta</button>
      </form>
    </div>

    <script>
  const professionalSelect = document.getElementById("professional");

  const dateInput = document.getElementById("appointment_date");

  const timeSelect = document.getElementById("appointment_time");

  const descriptionBox = document.getElementById("professional-description");

  const descriptions = {
    aline:
      "• Fisioterapia Ortopédica<br>• Liberação Miofascial<br>• Ventosaterapia<br>• Dry Needling<br>• DTM",

    gustavo:
      "• Atividades Especializadas para Idosos<br>• Pós Reabilitação<br>• Psicomotricidade",

    isabel:
      "• Psicopedagogia<br>• Estimulação Cognitiva para Idosos",
  };

  async function loadAvailableTimes() {
    const selectedProfessional = professionalSelect.value;

    const selectedDate = dateInput.value;

    if (descriptions[selectedProfessional]) {
      descriptionBox.innerHTML = descriptions[selectedProfessional];
      descriptionBox.style.display = "block";
    } else {
      descriptionBox.innerHTML = "";
      descriptionBox.style.display = "none";
    }

    if (!selectedProfessional || !selectedDate) {
      return;
    }

    const response = await fetch(
      `/available-times/?date=${selectedDate}&professional=${selectedProfessional}`,
    );

    const data = await response.json();

    timeSelect.innerHTML = '<option value="">Selecione um horário</option>';

    data.available_times.forEach((time) => {
      const option = document.createElement("option");

      option.value = time;
      option.textContent = time;

      timeSelect.appendChild(option);
    });
  }

  professionalSelect.addEventListener("change", loadAvailableTimes);

  dateInput.addEventListener("change", loadAvailableTimes);
</script>
  </body>
</html>
